# The shipped roster: SENNO's default pair (PRD §Architecture · Roster).
# Planner and builder on Claude Code (Anthropic); reviewer on Codex (OpenAI).
# An installation may replace either vendor as long as two remain.
# Model ids are pinned here and recorded on every phase row.
planner:
  harness: claude_code
  model: claude-opus-5-5
  thinking: high
  tools: [Read, Glob, Grep, Write, Edit]
  writes: ["specs/"]
  max_turns: 40
  phase_cap_usd: 1.50
  timeout_s: 1800
builder:
  harness: claude_code
  model: claude-opus-5-5
  thinking: medium
  tools: [Read, Glob, Grep, Write, Edit, Bash]
  writes: ["**"]
  max_turns: 80
  phase_cap_usd: 3.00
  timeout_s: 7200
# TEMPORARY (operator decision, 2026-10-25): the reviewer runs on Claude, the builder's
# vendor, until an OpenAI key is in place. The PRD (Cap. 4) wants a second vendor here; the
# factory only accepts this roster from its branch temp/single-vendor-review with
# FACTORY_SINGLE_VENDOR_REVIEW=1. A different model from the builder keeps some independence.
# Restore: harness codex, model gpt-5-codex, and drop `thinking`.
reviewer:
  harness: claude_code
  model: claude-sonnet-5-5
  thinking: high
  tools: [Read, Glob, Grep]
  writes: []
  max_turns: 40
  phase_cap_usd: 1.50
  timeout_s: 2700
