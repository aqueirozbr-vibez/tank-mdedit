name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2 mypy==2.4.0 pytest==9.1.1
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: pytest -q
